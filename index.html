<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ciclo da tuberculose bovina — do rebanho ao ser humano</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="wrap">
  <header>
    <h1>O ciclo da tuberculose bovina</h1>
    <p>Como a <i>Mycobacterium bovis</i> entra no rebanho, se instala no bovino, sai dele e chega ao ser humano — em 1 minuto.</p>
  </header>

  <div class="player">
    <div class="stagewrap" id="stagewrap">
    <div class="stagebox">
      <svg id="stage" viewBox="0 0 960 540" role="img" aria-label="Animação do ciclo de transmissão da tuberculose bovina">
        <defs>
          <g id="bac">
            <rect x="-13" y="-5.5" width="26" height="11" rx="5.5" fill="#C8404F" stroke="#8E2735" stroke-width="2"/>
            <circle cx="-4" cy="0" r="1.6" fill="#8E2735"/>
            <circle cx="4.5" cy="0" r="1.6" fill="#8E2735"/>
          </g>
          <g id="cow">
            <path d="M74,-8 q26,8 18,42" stroke="#6B3F29" stroke-width="6" fill="none" stroke-linecap="round"/>
            <circle cx="92" cy="36" r="6" fill="#4A2C1D"/>
            <rect x="-60" y="26" width="13" height="50" rx="5" fill="#7A4A31"/>
            <rect x="-30" y="28" width="13" height="50" rx="5" fill="#7A4A31"/>
            <rect x="18" y="28" width="13" height="50" rx="5" fill="#7A4A31"/>
            <rect x="46" y="26" width="13" height="50" rx="5" fill="#7A4A31"/>
            <rect x="-60" y="68" width="13" height="10" rx="3" fill="#3E281C"/>
            <rect x="-30" y="70" width="13" height="10" rx="3" fill="#3E281C"/>
            <rect x="18" y="70" width="13" height="10" rx="3" fill="#3E281C"/>
            <rect x="46" y="68" width="13" height="10" rx="3" fill="#3E281C"/>
            <ellipse cx="0" cy="0" rx="80" ry="48" fill="#8C5A3C"/>
            <ellipse cx="20" cy="-12" rx="26" ry="18" fill="#6B3F29" opacity=".85"/>
            <ellipse cx="-32" cy="16" rx="18" ry="13" fill="#6B3F29" opacity=".85"/>
            <ellipse cx="38" cy="40" rx="15" ry="11" fill="#E0A49A"/>
            <g transform="translate(-92,-30)">
              <ellipse cx="12" cy="-18" rx="13" ry="6.5" fill="#8C5A3C" transform="rotate(-24 12 -18)"/>
              <path d="M-8,-24 q-3,-13 9,-15" stroke="#D9C7A8" stroke-width="5" fill="none" stroke-linecap="round"/>
              <circle r="27" fill="#8C5A3C"/>
              <ellipse cx="-14" cy="9" rx="17" ry="12" fill="#C98E7A"/>
              <circle cx="-20" cy="8" r="2.4" fill="#5B3A28"/>
              <circle cx="1" cy="-5" r="3" fill="#241711"/>
            </g>
          </g>
          <g id="lungsIco">
            <path d="M0,-52 L0,-20" stroke="#B5525E" stroke-width="10" stroke-linecap="round" fill="none"/>
            <path d="M0,-20 L-17,-3 M0,-20 L17,-3" stroke="#B5525E" stroke-width="8" stroke-linecap="round" fill="none"/>
            <path d="M-14,-8 C-54,-2 -58,58 -30,66 C-9,72 -7,28 -9,-3 Z" fill="#E08A93"/>
            <path d="M14,-8 C54,-2 58,58 30,66 C9,72 7,28 9,-3 Z" fill="#E08A93"/>
          </g>
        </defs>

        <!-- fundo -->
        <rect x="0" y="0" width="960" height="540" fill="#CFE8F2"/>
        <circle cx="828" cy="86" r="42" fill="#F6D98B"/>
        <rect x="0" y="372" width="960" height="168" fill="#7FA65A"/>
        <rect x="0" y="372" width="960" height="12" fill="#6D9450"/>

        <!-- CENA 1 — abertura -->
        <g id="s1" class="scene">
          <g transform="translate(480,190)"><g class="an" id="s1title" opacity="0">
            <text text-anchor="middle" font-size="46" font-weight="700" fill="#1F2C24">Tuberculose bovina</text>
            <text y="38" text-anchor="middle" font-size="21" fill="#41584A">um ciclo que começa no rebanho</text>
          </g></g>
          <g transform="translate(480,330) scale(2.6)"><g class="an" id="s1bac" opacity="0"><use href="#bac"/></g></g>
          <g transform="translate(480,408)"><g class="an" id="s1name" opacity="0">
            <rect x="-106" y="-14" width="212" height="26" rx="13" fill="#FFF8EE" stroke="#2E4237" stroke-width="1.5"/>
            <text y="5" text-anchor="middle" font-size="17" font-style="italic" fill="#2E4237">Mycobacterium bovis</text>
          </g></g>
        </g>

        <!-- CENA 2 — chegada ao rebanho -->
        <g id="s2" class="scene" opacity="0">
          <g stroke="#9A7B52" stroke-width="7">
            <line x1="20" y1="322" x2="940" y2="322"/>
            <line x1="20" y1="296" x2="940" y2="296"/>
            <line x1="90" y1="276" x2="90" y2="340"/><line x1="330" y1="276" x2="330" y2="340"/>
            <line x1="600" y1="276" x2="600" y2="340"/><line x1="860" y1="276" x2="860" y2="340"/>
          </g>
          <g transform="translate(528,448)">
            <rect x="-62" y="-14" width="124" height="34" rx="7" fill="#7A5A3A"/>
            <ellipse cx="0" cy="-12" rx="54" ry="9" fill="#9FD3E8"/>
            <ellipse class="an" id="s2water" cx="0" cy="-12" rx="54" ry="9" fill="#C8404F" opacity="0"/>
          </g>
          <g transform="translate(206,396) scale(-0.92,0.92)"><use href="#cow"/></g>
          <g transform="translate(372,404) scale(-0.8,0.8)"><use href="#cow"/></g>
          <g class="an" id="s2walker">
            <g transform="translate(0,392)">
              <use href="#cow"/>
              <g transform="translate(-60,-120) scale(1.15)"><use href="#bac"/></g>
              <circle cx="-60" cy="-120" r="24" fill="none" stroke="#C8404F" stroke-width="2.5" stroke-dasharray="4 5"/>
            </g>
          </g>
          <g id="s2puffs"></g>
        </g>

        <!-- CENA 3 — dentro do bovino -->
        <g id="s3" class="scene" opacity="0">
          <g transform="translate(300,376) scale(1.32)"><use href="#cow"/></g>
          <g class="an" id="s3link" opacity="0">
            <line x1="330" y1="330" x2="574" y2="292" stroke="#2E4237" stroke-width="3" stroke-dasharray="7 7"/>
            <circle cx="330" cy="330" r="7" fill="#2E4237"/>
          </g>
          <g class="an" id="s3circle" opacity="0">
            <circle cx="676" cy="238" r="124" fill="#FFF8EE" stroke="#2E4237" stroke-width="4"/>
            <g transform="translate(676,232) scale(1.08)"><use href="#lungsIco"/></g>
            <rect x="566" y="322" width="220" height="24" rx="12" fill="#FFF8EE" stroke="#2E4237" stroke-width="1.5"/>
            <text x="676" y="339" text-anchor="middle" font-size="16" font-weight="700" fill="#5B3A28">granulomas (tubérculos)</text>
          </g>
          <g id="s3bacs"></g>
          <g id="s3gran"></g>
        </g>

        <!-- CENA 4 — saída da bactéria -->
        <g id="s4" class="scene" opacity="0">
          <g transform="translate(252,392) scale(-1,1)"><use href="#cow"/></g>
          <g class="an" id="s4lblAr" opacity="0">
            <text x="636" y="158" text-anchor="middle" font-size="19" font-weight="700" fill="#1F2C24">Pelo ar</text>
            <text x="636" y="182" text-anchor="middle" font-size="14.5" fill="#41584A">tosse e secreções respiratórias</text>
          </g>
          <g id="s4air"></g>
          <g transform="translate(206,474)">
            <path d="M-26,-26 L26,-26 L19,16 Q0,24 -19,16 Z" fill="#8FA3AD"/>
            <ellipse class="an" id="s4bmilk" cx="0" cy="-26" rx="24" ry="6" fill="#FFFFFF" opacity="0"/>
          </g>
          <g id="s4drops"></g>
          <g transform="translate(652,440)">
            <path d="M-22,-36 L22,-36 L17,22 Q0,30 -17,22 Z" fill="#EAF3F7" stroke="#9FB7C2" stroke-width="3"/>
            <ellipse cx="0" cy="-36" rx="21" ry="6" fill="#FFFFFF" stroke="#9FB7C2" stroke-width="2.5"/>
          </g>
          <g class="an" id="s4ride" opacity="0">
            <g transform="translate(0,0)">
              <circle r="13" fill="#FFFFFF" stroke="#9FB7C2" stroke-width="2.5"/>
              <g transform="scale(.6)"><use href="#bac"/></g>
            </g>
          </g>
          <g class="an" id="s4lblLeite" opacity="0">
            <text x="652" y="496" text-anchor="middle" font-size="19" font-weight="700" fill="#1F2C24">Pelo leite</text>
            <text x="652" y="519" text-anchor="middle" font-size="14.5" fill="#41584A">quando o úbere está infectado</text>
          </g>
        </g>

        <!-- CENA 5 — chegada ao ser humano -->
        <g id="s5" class="scene" opacity="0">
          <g transform="translate(168,428) scale(-0.62,0.62)"><use href="#cow"/></g>
          <g transform="translate(366,470)">
            <path d="M-21,0 L-21,-70 Q-21,-86 0,-86 Q21,-86 21,-70 L21,0 Z" fill="#3E6B8C"/>
            <circle cy="-103" r="15.5" fill="#E7B58F"/>
            <path d="M-15,-108 A15.5,15.5 0 0 1 15,-108 L13,-114 A15,15 0 0 0 -13,-114 Z" fill="#3A2A1E"/>
          </g>
          <g id="s5air"></g>
          <text class="an" id="s5lblAr" x="268" y="516" text-anchor="middle" font-size="15.5" font-weight="700" fill="#1F2C24" opacity="0">Pelo ar — contato próximo</text>

          <g transform="translate(724,470)">
            <path d="M-21,0 L-21,-70 Q-21,-86 0,-86 Q21,-86 21,-70 L21,0 Z" fill="#7A4E7E"/>
            <circle cy="-103" r="15.5" fill="#C98E63"/>
            <path d="M-15,-108 A15.5,15.5 0 0 1 15,-108 L13,-114 A15,15 0 0 0 -13,-114 Z" fill="#1F1611"/>
          </g>
          <g transform="translate(684,404)">
            <path d="M-11,-14 L11,-14 L8,10 Q0,14 -8,10 Z" fill="#FFFFFF" stroke="#9FB7C2" stroke-width="2.5"/>
          </g>
          <g class="an" id="s5sip" opacity="0">
            <circle r="8" fill="#FFFFFF" stroke="#9FB7C2" stroke-width="2"/>
            <g transform="scale(.42)"><use href="#bac"/></g>
          </g>
          <text class="an" id="s5lblLeite" x="724" y="516" text-anchor="middle" font-size="15.5" font-weight="700" fill="#1F2C24" opacity="0">Pelo leite cru e derivados</text>

          <g class="an" id="s5human" opacity="0">
            <circle cx="480" cy="196" r="86" fill="#FFF8EE" stroke="#2E4237" stroke-width="4"/>
            <g transform="translate(480,196) scale(.78)"><use href="#lungsIco"/></g>
            <text x="480" y="312" text-anchor="middle" font-size="16.5" font-weight="700" fill="#8E2735">tuberculose zoonótica</text>
          </g>
          <g class="an" id="s5land" opacity="0">
            <g transform="translate(455,214) scale(.7)"><use href="#bac"/></g>
          </g>
          <circle class="an" id="s5pulse" cx="455" cy="214" r="14" fill="none" stroke="#C8404F" stroke-width="3" opacity="0"/>
        </g>

        <!-- CENA 6 — como interromper -->
        <g id="s6" class="scene" opacity="0">
          <g class="an" id="s6a" opacity="0">
            <g transform="translate(236,268)">
              <rect x="-40" y="-12" width="80" height="9" rx="4" fill="#33434C"/>
              <rect x="-33" y="-4" width="66" height="44" rx="7" fill="#4A5B66"/>
              <ellipse cx="0" cy="-4" rx="27" ry="6" fill="#FFFFFF"/>
              <g id="s6steam"></g>
            </g>
            <text x="236" y="352" text-anchor="middle" font-size="17" font-weight="700" fill="#1F2C24">Pasteurizar o leite</text>
          </g>
          <g class="an" id="s6b" opacity="0">
            <g transform="translate(480,262)">
              <path d="M-26,-30 h52 a8 8 0 0 1 8 8 v30 a16 16 0 0 1 -16 16 h-36 a16 16 0 0 1 -16 -16 v-30 a8 8 0 0 1 8 -8 Z" fill="#E9B44C"/>
              <circle cy="-21" r="5" fill="#CFE8F2"/>
              <path d="M-13,2 L-3,12 L15,-8" stroke="#1F2C24" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
            </g>
            <text x="480" y="352" text-anchor="middle" font-size="17" font-weight="700" fill="#1F2C24">Testar o rebanho (PNCEBT)</text>
          </g>
          <g class="an" id="s6c" opacity="0">
            <g transform="translate(724,264)">
              <path d="M0,-36 L32,-23 V8 C32,28 17,40 0,46 C-17,40 -32,28 -32,8 V-23 Z" fill="#5E8744"/>
              <path d="M-12,2 L-3,11 L15,-9" stroke="#FFFFFF" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
            </g>
            <text x="724" y="352" text-anchor="middle" font-size="17" font-weight="700" fill="#1F2C24">Inspecionar e proteger</text>
          </g>
          <g transform="translate(480,448)"><g class="an" id="s6end" opacity="0">
            <text text-anchor="middle" font-size="27" font-weight="700" fill="#1F2C24">Assim o ciclo se interrompe.</text>
          </g></g>
        </g>
      </svg>

      <button class="poster" id="poster" type="button">
        <span class="ring" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l12-7z"/></svg>
        </span>
        <span id="posterLbl">Assistir (1 minuto)</span>
      </button>
      <button class="fsexit" id="fsExit" type="button" hidden>✕ Sair da tela cheia</button>
    </div>
      <div class="caption" id="cap" aria-live="polite"></div>
    </div>

    <div class="controls">
      <button class="ctl" id="btnPlay" type="button">Reproduzir</button>
      <button class="ctl sec" id="btnRestart" type="button">Recomeçar</button>
      <button class="ctl sec" id="btnFs" type="button">Tela cheia</button>
      <span class="time" id="timeLbl">0:00 / 1:00</span>
      <input type="range" id="seek" min="0" max="60000" step="50" value="0" aria-label="Posição na animação">
    </div>

    <div class="chapters" id="chapters" role="group" aria-label="Capítulos"></div>
  </div>

  <p class="foot">Animação educativa sobre a transmissão da <i>Mycobacterium bovis</i>. Não substitui orientação veterinária ou médica.</p>
</div>

<script src="js/script.js"></script>
</body>
</html>
